services:
  mysql:
    image: mysql:8.0
    container_name: sdui-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sdui_root_123
      MYSQL_DATABASE: sdui
    ports:
      - "3306:3306"
    volumes:
      - sdui_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-psdui_root_123"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sdui_mysql_data:
